name: 最近の更新

on:
  schedule:
    - cron: "17 21 * * *" # 毎朝 6:17（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README の「最近の更新」を書き換える
        run: python3 tools/update_recent.py README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 変わっていればコミット
        run: |
          if git diff --quiet README.md; then
            echo "変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 最近の更新を反映" README.md
          git push
