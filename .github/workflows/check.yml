name: 点検

# 変更依頼のたびに、README の点検と画像の作り直しを回す。
# どれも main には何も書き込まない。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: README と画像の点検
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_readme.py README.md


  images:
    name: 画像の作り直し
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 要る物を入れる
        run: |
          sh tools/setup_build.sh "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build" && npx playwright install-deps chromium
          python3 -m pip install --quiet fonttools brotli pillow
      - name: 作り直す
        env:
          NODE_PATH: ${{ runner.temp }}/build/node_modules
        run: sh tools/build_all.sh "$RUNNER_TEMP/build/fonts" "$RUNNER_TEMP/build" python3
      - name: 作り直した画像でも点検を通る
        run: |
          git status --short
          python3 tools/check_readme.py README.md
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-images
          path: assets/
