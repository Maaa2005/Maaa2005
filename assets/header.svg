<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Masashi Nakamura — AI agents, MCP, local LLMs, iOS">
  <style>
    .name { font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.5px; fill: #E6EDF3; }
    .tag  { font: 400 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8B949E; letter-spacing: .3px; }
    .dot  { fill: #7C8CFF; }
    .s { fill: #C9D1D9; animation: tw 4.8s ease-in-out infinite; }
    .s1 { animation-delay: 1.6s; } .s2 { animation-delay: 3.2s; }
    @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; } }
  </style>
  <defs>
    <radialGradient id="glow" cx="760" cy="104" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8CFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel"><rect x="0" y="0" width="900" height="200" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="199" rx="16" fill="#161B22" stroke="#30363D"/>
  <rect x="0" y="0" width="900" height="200" fill="url(#glow)" clip-path="url(#panel)"/>
  <g stroke="#3D4450" stroke-width="1">
    <line x1="640" y1="70" x2="700" y2="52"/>
    <line x1="700" y1="52" x2="812" y2="64"/>
    <line x1="812" y1="64" x2="752" y2="96"/>
    <line x1="752" y1="96" x2="860" y2="118"/>
    <line x1="752" y1="96" x2="790" y2="170"/>
    <line x1="790" y1="170" x2="708" y2="150"/>
    <line x1="640" y1="70" x2="752" y2="96"/>
    <line x1="812" y1="64" x2="842" y2="40"/>
  </g>
  <g>
    <circle class="s s0" cx="640" cy="70" r="2.6"/>
    <circle class="s s1" cx="700" cy="52" r="1.8"/>
    <circle class="s s2" cx="752" cy="96" r="3.2"/>
    <circle class="s s0" cx="812" cy="64" r="2.2"/>
    <circle class="s s1" cx="860" cy="118" r="2.6"/>
    <circle class="s s2" cx="708" cy="150" r="1.8"/>
    <circle class="s s0" cx="790" cy="170" r="2.4"/>
    <circle class="s s1" cx="842" cy="40" r="1.6"/>
  </g>
  <text class="name" x="44" y="108">Masashi Nakamura<tspan class="dot">.</tspan></text>
  <text class="tag" x="46" y="148">AI agents · MCP · local LLMs · iOS</text>
</svg>
